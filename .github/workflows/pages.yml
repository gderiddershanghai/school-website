name: GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public website only
        run: |
          mkdir -p _site
          cp index.html story.html jobs.html testimonials.html interview.html teacher-quiz.html robots.txt sitemap.xml _site/
          cp -R css js guides _site/
          cp -R recruitment _site/
          mkdir -p _site/images
          find images -maxdepth 1 -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" -o -name "*.svg" \) -exec cp {} _site/images/ \;
          cp -R images/optimized _site/images/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
